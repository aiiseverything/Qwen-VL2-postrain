# ============================================================================
# SFT 冒烟配置 —— 多卡 + DeepSpeed ZeRO-2
# 目的: 单卡路径已验证通过后, 再验证**分布式**这一层:
#   多卡能否正常初始化 → ZeRO-2 分片是否正确 → 梯度是否同步 → 能否多卡存档
#
# 用法 (本机实际可用卡为 4,5,6 三张):
#   CUDA_VISIBLE_DEVICES=4,5,6 FORCE_TORCHRUN=1 NPROC=3 \
#     .venv-lf/bin/llamafactory-cli train configs/smoke_sft_3gpu.yaml
# ============================================================================

model_name_or_path: models/Qwen2-VL-2B-Instruct
template: qwen2_vl
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false

dataset: postrain_sft_unfiltered
dataset_dir: configs
cutoff_len: 2048
max_samples: 24
preprocessing_num_workers: 4
dataloader_num_workers: 2

image_max_pixels: 262144
image_min_pixels: 1024

per_device_train_batch_size: 1
gradient_accumulation_steps: 2      # global batch = 1 × 2 × 3 卡 = 6
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
optim: adamw_torch
bf16: true
gradient_checkpointing: true

# ★ 分布式: DeepSpeed ZeRO-2 (与正式配置同一份)
deepspeed: configs/ds_zero2.json
ddp_timeout: 180000000

output_dir: results/smoke/sft_3gpu
logging_steps: 1
save_steps: 100000
save_total_limit: 1
plot_loss: false
report_to: none
max_steps: 6
