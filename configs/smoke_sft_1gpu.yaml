# ============================================================================
# SFT 冒烟配置 —— 单卡, 无 DeepSpeed
# 目的: 在引入分布式复杂度**之前**, 先验证最基础的一条路径:
#   数据能否读入 → <image> 占位符能否被模板正确处理 → 模型能否前向+反向 → loss 是否有限
# 只跑很少的步数, 不做任何效果判断。
#
# 用法:
#   CUDA_VISIBLE_DEVICES=4 .venv-lf/bin/llamafactory-cli train configs/smoke_sft_1gpu.yaml
# ============================================================================

model_name_or_path: models/Qwen2-VL-2B-Instruct
template: qwen2_vl
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false

dataset: postrain_sft_unfiltered
dataset_dir: configs
cutoff_len: 2048
max_samples: 32                 # 只取 32 条, 冒烟够用
preprocessing_num_workers: 4
dataloader_num_workers: 2

image_max_pixels: 262144
image_min_pixels: 1024

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
optim: adamw_torch
bf16: true
gradient_checkpointing: true

# 单卡冒烟: 不启用 DeepSpeed
deepspeed: null

output_dir: results/smoke/sft_1gpu
logging_steps: 1
save_steps: 100000
save_total_limit: 1
plot_loss: false
report_to: none
max_steps: 5                    # 只跑 5 步
