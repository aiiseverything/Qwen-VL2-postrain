# ============================================================================
# SFT 阶段 —— LLaMA-Factory
# 严格按 PLAN §8.1 编写 (用户指令: 严格照 PLAN 的 4×L40 写)
# 需求对应: R5 (DeepSpeed ZeRO-2, 4×L40) / R6 (冻结视觉编码器, 30 万数据 2 epoch)
# 注: 本配方按 PLAN 原值保留; 数据侧实际交付 40 万条 (4×L40 上 2 epoch ≈ 80 万样本次)
# ============================================================================

### 模型
model_name_or_path: models/Qwen2-VL-2B-Instruct
template: qwen2_vl                      # Qwen2-VL 专用模板, 决定 <image> 占位符处理
trust_remote_code: true

### 训练阶段
stage: sft
do_train: true
finetuning_type: full                   # 全参微调 (非 LoRA)
freeze_vision_tower: true               # ★ R6: 冻结视觉编码器 (ViT)
freeze_multi_modal_projector: false     # ★ D3: merger 保持可训练 (消融开关, 见 docs/02)

### 数据
dataset: postrain_sft                   # 在 dataset_info.json 中注册 -> data/processed/sft_400k.clean.jsonl
dataset_dir: configs
cutoff_len: 4096
max_samples: null                       # 不截断数据集; 用 debug 时的 --max_samples 覆盖
overwrite_cache: false
preprocessing_num_workers: 8            # 仅 CPU 预处理, 不占显存
dataloader_num_workers: 4

### 视觉输入 —— ⚠️ 这个参数直接决定显存 (见 docs/02 视觉 token 失控)
image_max_pixels: 262144                # 512×512 ≈ 334 visual tokens/图
image_min_pixels: 1024
video_max_pixels: 16384
video_fps: 2.0
video_maxlen: 32        # ★ LLaMA-Factory 默认 128 帧! 128帧×~20token/帧 ≈ 2560
                       #   视觉 token, 会直接撑爆 cutoff_len。32 帧 ≈ 640 token。

### 批与优化
per_device_train_batch_size: 4
gradient_accumulation_steps: 8          # global batch = 4 × 8 × 4 卡 = 128
learning_rate: 1.0e-5
num_train_epochs: 2.0                   # ★ R6: 2 epoch
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
optim: adamw_torch
bf16: true
fp16: false
gradient_checkpointing: true            # 省激活显存, 换 ~20-30% 速度

### 分布式 —— ★ R5: DeepSpeed ZeRO-2, 4×L40
deepspeed: configs/ds_zero2.json
ddp_timeout: 180000000                  # 防止大图像 batch 触发 NCCL 超时

### 日志与存档
output_dir: results/checkpoints/sft
logging_steps: 5
save_steps: 500
save_total_limit: 3
plot_loss: true
report_to: none                         # 如需 wandb, 改为 wandb 并配 WANDB_API_KEY

### 吞吐校准任务 (PLAN Phase 7.4): 先跑 100 step 测吞吐, 再放全量
# 用法: llamafactory-cli train configs/sft_qwen2vl_2b.yaml --max_steps 100
